[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lazyserver"
version = "0.1.0"
description = "TUI to configure, back up, restore, and learn about Linux network services."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LazyServer contributors" }]
dependencies = ["PyYAML>=6", "textual>=0.60"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
lazyserver = "lazyserver.cli:main"
lsrv = "lazyserver.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lazyserver*"]

[tool.setuptools.package-data]
lazyserver = [
    "data/tconf/services/*.yaml",
    "data/tconf/apps/*.yaml",
    "ui/*.tcss",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
