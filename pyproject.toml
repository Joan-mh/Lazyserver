[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lazyserver"
version = "0.1.0"
description = "TUI to configure, back up, restore, and learn about Linux network services."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LazyServer contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lazyserver = "lazyserver.cli:main"
lsrv = "lazyserver.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lazyserver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
